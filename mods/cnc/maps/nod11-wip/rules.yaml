^Bridge:
	DamageMultiplier@INVULNERABLE:
		Modifier: 0

BRIDGEHUT:
	-Targetable:

^OutpostBuilding:
	Buildable:
		Prerequisites: ~disabled
	Capturable:
		Types: building

FACT:
	AnnounceOnSeen:
		Notification: NewOptions
		TextNotification: notification-new-construction-options

GTWR:
	ExternalCondition@REVEALED:
		Condition: revealed
	RevealsShroud@REVEALED:
		RequiresCondition: revealed
		ValidRelationships: Enemy
		Range: 2c512
	# This is pure convenience so the frozen actor doesn't remain.
	RevealOnDeath:
		RequiresCondition: revealed
		Duration: 1
		RevealForRelationships: Enemy

HQ.OUTPOST:
	Inherits: HQ
	Inherits@OUTPOST: ^OutpostBuilding
	RenderSprites:
		Image: HQ

MISS:
	Inherits@OUTPOST: ^OutpostBuilding
	CaptureManager:
	Capturable:
		Types: building
	GrantConditionOnBotOwner@UNCAPTURED:
		Condition: uncaptured
		Bots: campaign
	RevealsShroud@UNCAPTURED:
		RequiresCondition: uncaptured
		ValidRelationships: Enemy
		Range: 1c0

NUKE.OUTPOST:
	Inherits: NUKE
	Inherits@OUTPOST: ^OutpostBuilding
	RenderSprites:
		Image: NUKE

PROC.OUTPOST:
	Inherits: PROC
	Inherits@OUTPOST: ^OutpostBuilding
	ProvidesPrerequisite:
		Prerequisite: proc
	RenderSprites:
		Image: proc

V25:
	SpawnActorOnDeath:
		Actor: moneycrate
		Offset: 0,1

RMBO.easy:
	Inherits: RMBO
	Health:
		HP: 30000
	ChangesHealth:
		Step: 500
		Delay: 10
		StartIfBelow: 50
		DamageCooldown: 200
	RenderSprites:
		Image: RMBO

RMBO.hard:
	Inherits: RMBO
	-AutoTarget:
	-AutoTargetPriority@DEFAULT:
	-AutoTargetPriority@ATTACKANYTHING:
	-AttackMove:
	RenderSprites:
		Image: RMBO

STNK:
	Buildable:
		Prerequisites: ~miss
	MustBeDestroyed:

BOAT:
	Health:
		HP: 150000
	RevealsShroud:
		ValidRelationships: Ally, Neutral, Enemy
		Range: 4c0

TRAN.IN:
	Inherits: TRAN
	RejectsOrders:
	-Selectable:
	RenderSprites:
		Image: TRAN
	Buildable:
		Prerequisites: ~disabled
	Interactable:
	-RevealsShroud:
