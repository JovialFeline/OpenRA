MOEBIUS:
	RevealOnDeath@ALLY:
		RevealForRelationships: Ally
		Duration: 1500
		Radius: 4c0
	RevealOnDeath@NEUTRAL:
		RevealForRelationships: Neutral
		Duration: 1500
		Radius: 12c0
	ActorLostNotification:
		Notification: CivilianKilled
		TextNotification: civilian-killed
		NotifyAll: true

APC:
	Cargo:
		PassengerConditions:
			moebius: carrying-doctor
	RevealOnDeath:
		RequiresCondition: carrying-doctor
		Duration: 1500
		Radius: 4c0
	ActorLostNotification:
		RequiresCondition: !carrying-doctor

ARTY:
	Buildable:
		Prerequisites: afld
	ScriptTags:

BGGY:
	ScriptTags:

FTNK:
