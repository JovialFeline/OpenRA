World:
	MissionData:
		Briefing: briefing
		StartVideo: psx_mission_intro_01.vqa
		WinVideo: nodlose.vqa
		LossVideo: gameover.vqa
	LuaScript:
		Scripts: campaign.lua, utils.lua, psx-gdi02.lua
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	TimeLimitManager:
		SkipTimerExpiredNotification: true

Player:
	PlayerResources:
		DefaultCash: 0
	ExternalCondition@campaignbuilder:
		Condition: nod-builder-enabled
	BaseBuilderBotModule@campaign:
		RequiresCondition: nod-builder-enabled
		BuildingQueues: Building.Nod
		MinBaseRadius: 0
		MaxBaseRadius: 4
		MinimumExcessPower: 40
		RallyPointScanRadius: 5
		ConstructionYardTypes: fact, hand
		PowerTypes: nuk2
		BuildingLimits:
			nuk2: 4
		BuildingFractions:
			nuk2: 1

^CivInfantry:
	GrantConditionOnTerrain@AVOIDCRUSH:
		Condition: on-bridge
		TerrainTypes: Bridge
	Crushable:
		RequiresCondition: on-bridge
	Wanders:
		AvoidTerrainTypes: Tiberium, BlueTiberium, Bridge

CAMERA.Obelisk:
	Inherits: CAMERA
	RevealsShroud:
		Range: 1c512
		Type: CenterPosition
	RenderSpritesEditorOnly:
		Image: CAMERA
	KillsSelf:
		RemoveInstead: true
		Delay: 1

FLARE:
	RevealsShroud:
		Range: 5c0

