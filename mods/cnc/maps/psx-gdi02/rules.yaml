TRAN.Extraction:
	Inherits: TRAN
	Cargo:
		PassengerConditions:
			moebius: carrying-doctor
	RejectsOrders:
		RequiresCondition: carrying-doctor
	RevealOnDeath:
		RequiresCondition: carrying-doctor
		Duration: 1500
		Radius: 4c0
	Voiced:
		RequiresCondition: !carrying-doctor
	ActorLostNotification:
		RequiresCondition: !carrying-doctor
	# Insurance v. a hypothetical last second death to missiles while extracting.
	DamageMultiplier:
		RequiresCondition: carrying-doctor && airborne
		Modifier: 0
	RenderSprites:
		Image: tran

OBLI:
	ExternalCondition@EASY:
		Condition: self-revealing
	RevealsShroud@EASY:
		RequiresCondition: self-revealing
		ValidRelationships: Enemy
		Range: 1c512

